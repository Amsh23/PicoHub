name: PicoHub Localet tunnel

on:
  push:
    paths-ignore:
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

# Localet is primary; a verified Cloudflare Quick Tunnel is the fallback.
concurrency:
  group: picohub-public-tunnel
  cancel-in-progress: true

jobs:
  run-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      LOCALET_TOKEN: ${{ secrets.loacalet_token }}
      LOCALET_SUBDOMAIN: ${{ secrets.LOCALET_SUBDOMAIN }}
      LOCALET_SERVER: ${{ secrets.LOCALET_SERVER }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PicoHub dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate database secrets
        shell: bash
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing secret TURSO_DATABASE_URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing secret TURSO_AUTH_TOKEN"; exit 1; }
      - name: Install tunnel clients
        shell: bash
        run: |
          if [ -n "$LOCALET_TOKEN" ]; then
            if curl -fL --retry 2 --connect-timeout 10 --max-time 90 "https://localet.ir/download/f/localet-linux-amd64" -o localet; then
              chmod +x localet
              ./localet version || true
              echo "LOCALET_BINARY_READY=1" >> "$GITHUB_ENV"
            else
              echo "Localet client download failed; Cloudflare fallback will be used."
            fi
          else
            echo "Localet token is not configured; Cloudflare fallback will be used."
          fi
          curl -fL --retry 3 --connect-timeout 10 --max-time 90 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" -o cloudflared
          chmod +x cloudflared
          ./cloudflared --version
      - name: Diagnose Localet relay connectivity from GitHub Actions
        shell: bash
        run: |
          if [ ! -x ./localet ]; then
            echo "LOCALET_BINARY_READY=0" >> "$GITHUB_ENV"
            echo "Localet binary unavailable; the Cloudflare fallback will be used."
            exit 0
          fi
          echo "---- Localet CLI help (bounded to 5 seconds) ----"
          timeout 5s ./localet client --help > localet-help.log 2>&1 || true
          cat localet-help.log || true
          echo "---- DNS/TCP reachability for tunnel.lclt.ir ----"
          python - <<'PY'
          import os, socket, time
          host = "tunnel.lclt.ir"
          reachable = False
          try:
              addresses = sorted({x[4][0] for x in socket.getaddrinfo(host, None, type=socket.SOCK_STREAM)})
              print(f"DNS {host}: {', '.join(addresses)}")
          except Exception as exc:
              addresses = []
              print(f"DNS lookup failed: {type(exc).__name__}: {exc}")
          for address in addresses:
              for port in (443, 4443):
                  start = time.monotonic()
                  try:
                      with socket.create_connection((address, port), timeout=5):
                          print(f"TCP {address}:{port}: reachable in {time.monotonic()-start:.2f}s")
                          reachable = True
                  except Exception as exc:
                      print(f"TCP {address}:{port}: {type(exc).__name__}: {exc}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"LOCALET_NETWORK_REACHABLE={'1' if reachable else '0'}\n")
          if not reachable:
              print("::warning::TCP preflight could not reach tunnel.lclt.ir on 443/4443. Localet will still be tested directly with auto, WebSocket, QUIC and TCP transports before using Cloudflare fallback.")
          PY
      - name: Start PicoHub
        shell: bash
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8080 > app.log 2>&1 &
          APP_PID=$!
          echo "PICOHUB_APP_PID=$APP_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/api/health -o /tmp/picohub-local-health.json 2>/dev/null &&
               python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_reachable") is True else 1)' < /tmp/picohub-local-health.json; then
              echo "PicoHub and its database are healthy on port 8080."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat app.log; exit 1; fi
            sleep 2
          done
          cat app.log
          echo "PicoHub did not become ready with a reachable database."
          exit 1
      - name: Open Localet tunnel, fallback if unavailable, publish verified URL, and keep runner alive
        shell: bash
        run: |
          URL=""
          TUNNEL_PID=""
          TUNNEL_MODE=""
          LOCAL_HELP=$(cat localet-help.log 2>/dev/null || true)
          LOCALET_SERVER="${LOCALET_SERVER:-tunnel.lclt.ir}"
          LOCALET_READY="${LOCALET_BINARY_READY:-0}"

          # TCP preflight is diagnostic only: it cannot determine whether UDP/QUIC works.
          # Try Localet even after a failed probe, in each supported transport mode.
          if [ "$LOCALET_READY" = "1" ] && [ -n "$LOCALET_TOKEN" ]; then
            BASE_ARGS=(client --server "$LOCALET_SERVER" --token "$LOCALET_TOKEN" --port 8080)
            if [ -n "$LOCALET_SUBDOMAIN" ]; then
              SUBDOMAIN_VALUE="$LOCALET_SUBDOMAIN"
              SUBDOMAIN_VALUE="${SUBDOMAIN_VALUE#https://}"
              SUBDOMAIN_VALUE="${SUBDOMAIN_VALUE#http://}"
              SUBDOMAIN_VALUE="${SUBDOMAIN_VALUE%/}"
              if grep -Eq -- '(^|[[:space:]])-{1,2}subdomain([[:space:]]|$)' <<< "$LOCAL_HELP"; then
                BASE_ARGS+=(--subdomain "$SUBDOMAIN_VALUE")
              else
                echo "WARNING: This Localet client did not advertise a subdomain flag; checking the configured hostname separately."
              fi
            fi

            for transport in auto ws quic tcp; do
              echo "Trying Localet transport: $transport (server: $LOCALET_SERVER)"
              LOCAL_LOG="localet-${transport}.log"
              LOCAL_ARGS=("${BASE_ARGS[@]}" --transport "$transport")
              ./localet "${LOCAL_ARGS[@]}" > "$LOCAL_LOG" 2>&1 &
              LOCAL_PID=$!
              # Allow connection setup while bounding each transport attempt to 40 seconds.
              for i in $(seq 1 20); do
                if ! kill -0 "$LOCAL_PID" 2>/dev/null; then
                  echo "Localet transport $transport exited during setup."
                  break
                fi
                CANDIDATES=$(grep -Eo 'https?://[[:alnum:].-]+' "$LOCAL_LOG" | sort -u || true)
                if [ -n "$LOCALET_SUBDOMAIN" ]; then
                  SUBDOMAIN_VALUE="$LOCALET_SUBDOMAIN"
                  SUBDOMAIN_VALUE="${SUBDOMAIN_VALUE#https://}"
                  SUBDOMAIN_VALUE="${SUBDOMAIN_VALUE#http://}"
                  SUBDOMAIN_VALUE="${SUBDOMAIN_VALUE%/}"
                  if [[ "$SUBDOMAIN_VALUE" != *.* ]]; then SUBDOMAIN_VALUE="$SUBDOMAIN_VALUE.lclt.ir"; fi
                  CANDIDATES="$CANDIDATES https://$SUBDOMAIN_VALUE"
                fi
                for candidate in $CANDIDATES; do
                  case "$candidate" in
                    https://tunnel.lclt.ir|http://tunnel.lclt.ir|https://localet.ir|http://localet.ir) continue ;;
                  esac
                  if curl --fail --silent --connect-timeout 3 --max-time 6 "$candidate/api/health" -o /tmp/picohub-public-health.json 2>/dev/null &&
                     python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_reachable") is True else 1)' < /tmp/picohub-public-health.json; then
                    URL="$candidate"
                    TUNNEL_PID="$LOCAL_PID"
                    TUNNEL_MODE="Localet ($transport)"
                    break 2
                  fi
                done
                sleep 2
              done
              if [ -z "$URL" ]; then
                kill "$LOCAL_PID" 2>/dev/null || true
                sleep 1
                kill -0 "$LOCAL_PID" 2>/dev/null && kill -9 "$LOCAL_PID" 2>/dev/null || true
                echo "Localet transport $transport did not produce a URL passing the public health check."
                cat "$LOCAL_LOG" || true
              fi
            done

            if [ -z "$URL" ]; then
              echo "All Localet transports failed public verification; Cloudflare fallback will be attempted."
            fi
          else
            if [ "$LOCALET_READY" != "1" ]; then
              echo "Localet binary is unavailable; Cloudflare fallback will be attempted."
            else
              echo "Localet token is missing; Cloudflare fallback will be attempted."
            fi
          fi

          if [ -z "$URL" ]; then
            ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 --output json > cloudflared.log 2>&1 &
            TUNNEL_PID=$!
            for i in $(seq 1 90); do
              if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
                echo "Cloudflare fallback exited before a public URL became healthy."
                cat cloudflared.log
                [ -f localet.log ] && cat localet.log || true
                exit 1
              fi
              CANDIDATES=$(grep -Eo 'https://[[:alnum:]-]+\.trycloudflare\.com' cloudflared.log | sort -u || true)
              for candidate in $CANDIDATES; do
                if curl --fail --silent --connect-timeout 2 --max-time 5 "$candidate/api/health" -o /tmp/picohub-public-health.json 2>/dev/null &&
                   python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_reachable") is True else 1)' < /tmp/picohub-public-health.json; then
                  URL="$candidate"
                  TUNNEL_MODE="Cloudflare Quick Tunnel (fallback)"
                  break 2
                fi
              done
              sleep 2
            done
          fi

          if [ -z "$URL" ]; then
            echo "No tunnel URL passed the external PicoHub health check."
            [ -f localet.log ] && cat localet.log || true
            [ -f cloudflared.log ] && cat cloudflared.log || true
            exit 1
          fi
          echo "Verified public URL: $URL"
          echo "Tunnel mode: $TUNNEL_MODE"
          export PICOHUB_PUBLIC_URL="$URL"
          export PICOHUB_TUNNEL_MODE="$TUNNEL_MODE"
          python - <<'PY'
          import base64, json, os, re, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = os.environ["PICOHUB_PUBLIC_URL"]
          mode = os.environ["PICOHUB_TUNNEL_MODE"]
          api = f"https://api.github.com/repos/{repo}/contents/README.md"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "PicoHub-Tunnel-Workflow",
          }
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=20) as response:
              current = json.load(response)
          content = base64.b64decode(current["content"]).decode("utf-8")
          live_line = f"**Live URL:** [{url}]({url})"
          def replace_line(source, label, value):
              pattern = rf"(?m)^{re.escape(label)}.*$"
              new_line = f"{label} {value}"
              if re.search(pattern, source):
                  return re.sub(pattern, lambda _: new_line, source, count=1)
              return source.replace(live_line, live_line + "\n" + new_line, 1)
          updated = replace_line(content, "**Live URL:**", f"[{url}]({url})")
          if mode == "Localet":
              localet_value = f"[{url}]({url})"
              cloudflare_value = "_Inactive in this run; Localet passed the public health check._"
          else:
              localet_value = "_Relay not reachable from this GitHub-hosted runner; see the workflow diagnostics._"
              cloudflare_value = f"[{url}]({url})"
          updated = replace_line(updated, "**Localet URL:**", localet_value)
          updated = replace_line(updated, "**Cloudflare fallback:**", cloudflare_value)
          updated = replace_line(updated, "**Tunnel:**", mode)
          if updated != content:
              payload = json.dumps({
                  "message": "Update verified PicoHub public tunnel URL",
                  "content": base64.b64encode(updated.encode()).decode(),
                  "sha": current["sha"],
                  "branch": "main",
              }).encode()
              request = urllib.request.Request(api, data=payload, headers={**headers, "Content-Type": "application/json"}, method="PUT")
              with urllib.request.urlopen(request, timeout=20) as response: response.read()
              print("README updated with the verified tunnel URL and mode.")
          else:
              print("README already contains the current verified URL.")
          PY

          FAILURES=0
          END=$((SECONDS + 340*60))
          while [ "$SECONDS" -lt "$END" ]; do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "$TUNNEL_MODE process stopped."
              [ -f localet.log ] && cat localet.log || true
              [ -f cloudflared.log ] && cat cloudflared.log || true
              exit 1
            fi
            if ! kill -0 "$PICOHUB_APP_PID" 2>/dev/null; then
              echo "PicoHub app process stopped."
              cat app.log
              exit 1
            fi
            if ! curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/health -o /tmp/picohub-local-health.json 2>/dev/null ||
               ! python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_reachable") is True else 1)' < /tmp/picohub-local-health.json; then
              echo "PicoHub local health check failed."
              cat app.log
              exit 1
            fi
            if curl --fail --silent --max-time 8 "$URL/api/health" -o /tmp/picohub-public-health.json 2>/dev/null &&
               python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_reachable") is True else 1)' < /tmp/picohub-public-health.json; then
              FAILURES=0
            else
              FAILURES=$((FAILURES + 1))
              echo "Public health check failed ($FAILURES/5)."
              if [ "$FAILURES" -ge 5 ]; then
                echo "Public tunnel failed five consecutive health checks."
                [ -f localet.log ] && cat localet.log || true
                [ -f cloudflared.log ] && cat cloudflared.log || true
                exit 1
              fi
            fi
            sleep 30
          done
      - name: Show diagnostic logs if failed
        if: failure()
        run: |
          echo "---- app.log ----"
          cat app.log || true
          echo "---- localet.log ----"
          cat localet.log || true
          echo "---- cloudflared.log ----"
          cat cloudflared.log || true
