name: PicoHub Cloudflare Quick Tunnel

on:
  push:
    paths-ignore:
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

# GitHub-hosted runners are temporary and the URL is ephemeral.
concurrency:
  group: picohub-public-tunnel
  cancel-in-progress: true

jobs:
  run-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PicoHub dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$TURSO_DATABASE_URL" || { echo "Missing secret TURSO_DATABASE_URL"; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo "Missing secret TURSO_AUTH_TOKEN"; exit 1; }
      - name: Install Cloudflare tunnel client
        run: |
          curl -fL --retry 3 --connect-timeout 10 \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -o cloudflared
          chmod +x cloudflared
          ./cloudflared --version
      - name: Start PicoHub
        shell: bash
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8080 > app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/api/health \
                 -o /tmp/picohub-local-health.json 2>/dev/null &&
               python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_configured") is True else 1)' \
                 < /tmp/picohub-local-health.json; then
              echo "PicoHub server and database are healthy on port 8080."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat app.log
              exit 1
            fi
            sleep 2
          done
          cat app.log
          echo "PicoHub did not become ready with a configured database."
          exit 1
      - name: Start Cloudflare Quick Tunnel, publish verified URL, and keep runner alive
        shell: bash
        run: |
          ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 --output json > cloudflared.log 2>&1 &
          TUNNEL_PID=$!
          URL=""
          for i in $(seq 1 90); do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "cloudflared exited before a public URL became healthy."
              cat cloudflared.log
              exit 1
            fi
            CANDIDATES=$(grep -Eo 'https://[[:alnum:]-]+\.trycloudflare\.com' cloudflared.log | sort -u || true)
            for candidate in $CANDIDATES; do
              if curl --fail --silent --connect-timeout 2 --max-time 5 \
                   "$candidate/api/health" -o /tmp/picohub-public-health.json 2>/dev/null &&
                 python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_configured") is True else 1)' \
                   < /tmp/picohub-public-health.json; then
                URL="$candidate"
                break 2
              fi
            done
            sleep 2
          done
          if [ -z "$URL" ]; then
            cat cloudflared.log
            echo "No externally reachable Cloudflare URL passed the PicoHub health check."
            exit 1
          fi
          echo "Verified PicoHub public URL: $URL"
          export PICOHUB_PUBLIC_URL="$URL"
          python - <<'PY'
          import base64, json, os, re, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = os.environ["PICOHUB_PUBLIC_URL"]
          api = f"https://api.github.com/repos/{repo}/contents/README.md"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "PicoHub-Cloudflare-Workflow",
          }
          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req, timeout=20) as response:
              current = json.load(response)
          content = base64.b64decode(current["content"]).decode("utf-8")
          line = f"**Live URL:** [{url}]({url})"
          pattern = r"(?m)^\*\*Live URL:\*\*.*$"
          if re.search(pattern, content):
              updated = re.sub(pattern, lambda _: line, content, count=1)
          else:
              updated = content.replace(
                  "## GitHub Actions + Cloudflare Quick Tunnel",
                  "## GitHub Actions + Cloudflare Quick Tunnel\n\n" + line,
                  1,
              )
          if updated != content:
              payload = json.dumps({
                  "message": "Update verified PicoHub Cloudflare Quick Tunnel URL",
                  "content": base64.b64encode(updated.encode()).decode(),
                  "sha": current["sha"],
                  "branch": "main",
              }).encode()
              put = urllib.request.Request(
                  api, data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urllib.request.urlopen(put, timeout=20) as response:
                  response.read()
              print("README updated with the verified live URL.")
          else:
              print("README already contains the verified live URL.")
          PY
          FAILURES=0
          END=$((SECONDS + 340*60))
          while [ "$SECONDS" -lt "$END" ]; do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "cloudflared stopped."
              cat cloudflared.log
              exit 1
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "PicoHub app process stopped."
              cat app.log
              exit 1
            fi
            if ! curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/health \
                 -o /tmp/picohub-local-health.json 2>/dev/null ||
               ! python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_configured") is True else 1)' \
                 < /tmp/picohub-local-health.json; then
              echo "PicoHub local health check failed."
              cat app.log
              exit 1
            fi
            if curl --fail --silent --max-time 8 "$URL/api/health" \
                 -o /tmp/picohub-public-health.json 2>/dev/null &&
               python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") is True and d.get("database_configured") is True else 1)' \
                 < /tmp/picohub-public-health.json; then
              FAILURES=0
            else
              FAILURES=$((FAILURES + 1))
              echo "Public health check failed ($FAILURES/5)."
              if [ "$FAILURES" -ge 5 ]; then
                echo "Public tunnel failed five consecutive health checks."
                cat cloudflared.log
                exit 1
              fi
            fi
            sleep 30
          done
      - name: Show diagnostic logs if failed
        if: failure()
        run: |
          echo "---- app.log ----"
          cat app.log || true
          echo "---- cloudflared.log ----"
          cat cloudflared.log || true
