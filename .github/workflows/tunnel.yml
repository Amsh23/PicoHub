name: PicoHub temporary public tunnel
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

# Scheduled runs replace the previous run. Runners are temporary, not an always-on host.
concurrency:
  group: picohub-public-tunnel
  cancel-in-progress: true

jobs:
  run-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Turso secrets
        run: |
          test -n "$TURSO_DATABASE_URL" || (echo "Missing repository secret TURSO_DATABASE_URL" && exit 1)
          test -n "$TURSO_AUTH_TOKEN" || (echo "Missing repository secret TURSO_AUTH_TOKEN" && exit 1)
      - name: Start PicoHub
        run: |
          nohup uvicorn app:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              echo "PicoHub server is responding."
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/api/health
      - name: Install Cloudflare Tunnel client
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
      - name: Start public tunnel and keep job alive
        run: |
          ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              echo "=================================================="
              echo "PicoHub public URL: $URL"
              echo "This temporary URL changes when the tunnel restarts."
              echo "=================================================="
              break
            fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              cat tunnel.log
              exit 1
            fi
            sleep 2
          done
          if [ -z "${URL:-}" ]; then
            cat tunnel.log
            echo "Could not obtain a Cloudflare Quick Tunnel URL."
            exit 1
          fi
          # Keep the runner alive while checking that both processes are still running.
          END=$((SECONDS + 340*60))
          while [ "$SECONDS" -lt "$END" ]; do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "Tunnel process stopped."
              cat tunnel.log
              exit 1
            fi
            if ! kill -0 "$(pgrep -f 'uvicorn app:app' | head -n 1)" 2>/dev/null; then
              echo "App process stopped."
              cat app.log
              exit 1
            fi
            sleep 30
          done
      - name: Show diagnostic logs if failed
        if: failure()
        run: |
          echo "---- app.log ----"
          cat app.log || true
          echo "---- tunnel.log ----"
          cat tunnel.log || true
